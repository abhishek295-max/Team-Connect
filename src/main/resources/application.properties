spring.mvc.view.prefix=/
spring.mvc.view.suffix=.jsp
spring.config.import=optional:file:.env[.properties],optional:file:.env.local[.properties]
server.servlet.context-path=${CONTEXT_PATH:}
server.port=9090
server.forward-headers-strategy=framework
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.compression.enabled=true
server.compression.mime-types=text/html,text/plain,text/css,application/javascript,application/json,image/svg+xml
server.error.include-message=never
server.error.include-binding-errors=never

app.database.url=${DB_URL:jdbc:mysql://localhost:3306/online_chat_app?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
app.database.username=${DB_USERNAME:root}
app.database.password=${DB_PASSWORD:}
spring.datasource.url=${app.database.url}
spring.datasource.username=${app.database.username}
spring.datasource.password=${app.database.password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Employee Management integration. Keep disabled until the EMS schema is ready.
ems.integration.enabled=${EMS_INTEGRATION_ENABLED:true}
ems.files.directory=${EMS_FILES_DIRECTORY:${java.io.tmpdir}/teamconnect-ems-files}
ems.mail.enabled=${EMS_MAIL_ENABLED:false}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${EMS_MAX_FILE_SIZE:20MB}
spring.servlet.multipart.max-request-size=${EMS_MAX_REQUEST_SIZE:22MB}
ems.mail.from=${EMS_MAIL_FROM:no-reply@example.com}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

spring.ai.openai.api-key=${GROQ_API_KEY:}
spring.ai.openai.base-url=${GROQ_BASE_URL:https://api.groq.com/openai}
spring.ai.openai.chat.options.model=${GROQ_MODEL:openai/gpt-oss-120b}
spring.ai.openai.chat.options.temperature=0.4
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=${ACTUATOR_HEALTH_DETAILS:never}
