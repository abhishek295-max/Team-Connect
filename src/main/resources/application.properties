spring.mvc.view.prefix=/
spring.mvc.view.suffix=.jsp
server.servlet.context-path=${CONTEXT_PATH:}
server.port=9090

app.database.url=${DB_URL:jdbc:mysql://localhost:3306/online_chat_app?useSSL=false&serverTimezone=UTC}
app.database.username=${DB_USERNAME:root}
app.database.password=${DB_PASSWORD:}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/online_chat_app?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

spring.ai.openai.api-key=${GROQ_API_KEY:}
spring.ai.openai.base-url=${GROQ_BASE_URL:https://api.groq.com/openai}
spring.ai.openai.chat.options.model=${GROQ_MODEL:openai/gpt-oss-120b}
spring.ai.openai.chat.options.temperature=0.4
